version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/New_York
      versioning-strategy: increase-if-necessary
      groups:
          composer-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: America/New_York
      groups:
          actions-minor-and-patch:
              update-types: [minor, patch]
